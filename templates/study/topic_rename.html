{% extends "base.html" %}
{% block title %}Rename Topic — {{ topic.name }}{% endblock %}

{% block content %}
<div class="page-header">
    <nav aria-label="breadcrumb">
        <div class="breadcrumb-custom">
            <a href="{% url 'subject_list' %}"><i class="bi bi-book-half me-1"></i>Subjects</a>
            <span class="mx-2 text-muted">&rsaquo;</span>
            <a href="{% url 'topic_list' topic.subject.id %}">{{ topic.subject.name }}</a>
            <span class="mx-2 text-muted">&rsaquo;</span>
            <span class="active">Rename Topic</span>
        </div>
    </nav>
    <h1>Rename Topic</h1>
    <p>Update title for "{{ topic.name }}" under <strong>{{ topic.subject.name }}</strong>.</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="name" class="form-label">Topic Title</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ topic.name }}" required autofocus>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'topic_list' topic.subject.id %}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check2 me-1"></i>Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
