{% extends "base.html" %}
{% block title %}Delete Note — {{ topic.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-danger-subtle shadow-lg">
            <div class="card-body text-center p-4">
                <div class="stat-avatar rose mx-auto mb-3" style="width: 58px; height: 58px; font-size: 1.75rem;">
                    <i class="bi bi-trash-fill"></i>
                </div>
                <h4 class="fw-bold mb-2">Delete Study Note?</h4>
                <p class="text-muted small mb-3">Topic: <strong>{{ topic.name }}</strong> ({{ topic.subject.name }})</p>
                <div class="card bg-light-subtle p-3 mb-4 text-start font-monospace small" style="max-height: 120px; overflow-y: auto;">
                    {{ note.content|truncatechars:200 }}
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'note_view' topic.id %}" class="btn btn-outline-secondary px-3">
                            Keep Note
                        </a>
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="bi bi-trash-fill me-1"></i>Delete Note
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
